[workspace]
resolver = "3"
members = ["crates/*", "shorty-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Общие зависимости workspace: версии задаются в одном месте,
# члены workspace подключают их через `dep = { workspace = true }`,
# чтобы версии не расползались между crates.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
axum = "0.8.9"
criterion = "0.8.2"
dashmap = "6.2.1"
http-body-util = "0.1.4"
mime = "0.3.17"
nanoid = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = [
    "trace",
    "timeout",
    "limit",
    "request-id",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
